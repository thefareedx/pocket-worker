name: Private stage checks
on:
  push:
    branches: [saas-private]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: node editable-source.cjs
      - run: npm ci --ignore-scripts && npm test && npm run build
        working-directory: source
      - run: go test ./...
        working-directory: source
